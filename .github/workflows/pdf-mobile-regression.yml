name: PDF mobile regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/pdf-mobile-render']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: node --check app.js
      - name: PDF mobile regression tests
        run: node --test tests/*.test.mjs
